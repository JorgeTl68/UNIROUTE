name: Reportar un error
description: Algo no funciona como debería.
title: "[Error] "
labels: ["error"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué hiciste y qué viste.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: pantalla
    attributes:
      label: Pantalla o ruta
      placeholder: /admin/unidades
  - type: textarea
    id: evidencia
    attributes:
      label: Capturas o mensaje de error
      description: Pega el error de la consola o de storage/logs/laravel.log si lo hay.
